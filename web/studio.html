<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>제작실 · Hotpost</title><link rel="stylesheet" href="studio.css?v=2"><link rel="stylesheet" href="studio-board.css?v=1"></head>
<body>
<aside class="rail"><a class="brand" href="index.html"><span>h</span> hotpost</a><div class="workspace">MY WORKSPACE</div>
<nav><a href="index.html">◈ <span>소재 탐색</span></a><a class="active" href="studio.html">▣ <span>제작실</span><i id="rail-count">0</i></a><a href="accounts.html">◎ <span>모니터링 계정</span></a></nav>
<div class="rail-note"><span class="live-dot"></span> 나의 쇼츠 작업 공간<p>검토는 차례로,<br>제작은 끊김 없이.</p></div></aside>
<main><header class="page-head"><div><div class="eyebrow">PRODUCTION STUDIO</div><h1>제작실 <span id="total-count">0</span></h1><p>영상이 완성되기까지, 지금 어디에 있는지 한눈에 확인하세요.</p></div><a class="primary button" href="index.html">＋ 소재 추가</a></header>
<div id="connection" class="notice" role="status" hidden></div>
<section id="overview" class="overview" aria-label="제작 현황"></section>
<div class="work-heading"><div class="tabs" id="filters"><button class="selected" data-filter="all">전체 작업</button><button data-filter="review">검토할 작업</button><button data-filter="running">처리 중</button><button data-filter="attention">확인 필요</button><button data-filter="completed">제작 완료</button></div><label class="search">⌕ <input id="search" placeholder="제목 또는 소재 ID 검색" aria-label="작업 검색"></label></div>
<div class="board-guide"><span>영상 선택 → 상세 편집</span><span>단계는 제작 상태에 따라 자동으로 이동합니다</span></div>
<p id="board-empty" class="board-empty" hidden></p>
<section id="work-list" class="kanban-board" aria-label="제작 단계별 칸반 보드"></section>
</main>
<div id="toast" role="status" hidden></div>
<aside id="work-drawer" class="work-drawer" aria-labelledby="drawer-title" hidden>
<header class="drawer-head"><div><p id="drawer-code" class="eyebrow"></p><h2 id="drawer-title" tabindex="-1"></h2><p id="drawer-status"></p></div><div class="drawer-controls"><button id="expand-work" class="secondary" aria-pressed="false">전체화면</button><button id="close-work" class="icon" aria-label="작업 상세 닫기">×</button></div></header>
<nav id="detail-tabs" class="detail-tabs" aria-label="상세 작업 종류"><button data-detail-tab="sources">소스</button><button data-detail-tab="script">대본</button><button data-detail-tab="voice">음성</button><button data-detail-tab="edit">편집</button><button data-detail-tab="results">결과·이력</button></nav>
<div id="drawer-scroll" class="drawer-scroll"><section id="detail" aria-label="작업 상세"></section></div>
</aside>
<dialog id="candidate-dialog"><div class="dialog-head"><div><div class="eyebrow">SCENE CANDIDATES</div><h2>이 대사에 맞는 장면</h2></div><button id="close-candidates" class="icon" aria-label="닫기">×</button></div><p id="candidate-caption"></p><div id="candidates" class="candidates"></div></dialog>
<dialog id="script-dialog"><div class="dialog-head"><div><div class="eyebrow">SCRIPT COMPARISON</div><h2>변경 전후를 비교해 주세요</h2></div><button id="close-script-dialog" class="icon" aria-label="비교 닫기">×</button></div><div id="script-comparison"></div></dialog>
<link rel="stylesheet" href="production-flow.css?v=2">
<script src="production-flow.js?v=3"></script>
<script src="studio-board.js?v=1"></script>
<script src="studio.js?v=6-kanban"></script></body></html>
