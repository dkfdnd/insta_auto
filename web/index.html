<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 터진 게시물</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div>
      <h1>🔥 오늘의 터진 게시물</h1>
      <p class="sub" id="meta">데이터를 불러오는 중…</p>
    </div>
    <div class="top-right">
      <a class="btn" href="studio.html">▣ 제작실</a>
      <span class="badge" id="source-badge"></span>
      <a class="btn ghost" href="accounts.html">👥 레퍼런스 계정</a>
      <a class="btn ghost" href="settings.html">설정</a>
      <button class="btn ghost" id="theme-toggle" title="테마 전환">🌙</button>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  <div id="studio-selection" style="position:sticky;top:8px;z-index:20;background:#245f50;color:#fff;border-radius:10px;padding:12px 18px;display:flex;align-items:center;gap:14px;margin-bottom:12px" hidden><b id="studio-selected-count">0개 선택</b><span style="flex:1">선택한 소재를 준비하고 대본부터 검토합니다</span><button class="btn" id="studio-add-selected">제작실에 추가 →</button></div>
  <div id="banner" class="banner" hidden></div>
  <div id="collection-health" class="banner" role="status" hidden></div>

  <section class="stats" id="stats"></section>
  <section class="section">
    <div class="section-head">
      <h2>오늘의 핫 주제</h2>
      <p class="hint">기준을 통과한 게시물을 상위 카테고리로 묶었습니다. 클릭하면 해당 주제만 봅니다.</p>
    </div>
    <div class="chips" id="topics"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>터진 게시물</h2>
      <p class="hint" id="result-count"></p>
    </div>
    <div class="listing-toolbar"><div id="current-settings" class="current-settings" aria-label="현재 설정"></div><a class="btn ghost" href="settings.html">설정 변경</a><div class="compact-search"><button class="icon-button" id="search-toggle" aria-label="검색창 열기" aria-expanded="false" aria-controls="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><div id="search-box" hidden><input id="q" type="search" aria-label="게시물 검색" placeholder="캡션·해시태그 검색"></div></div></div>
    <div class="grid" id="cards"></div>
    <div class="empty" id="empty" hidden></div>
  </section>

</main>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="닫기">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="data.js?v=studio-top-two"></script>
<script src="hot-detection.js?v=1"></script>
<link rel="stylesheet" href="production-flow.css?v=2">
<script src="production-flow.js?v=2"></script>
<script src="display-settings.js?v=1"></script>
<script src="notices.js?v=1"></script>
<script src="app.js?v=14-notices"></script>
</body>
</html>
